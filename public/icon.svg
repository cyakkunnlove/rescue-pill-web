<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8A0BF"/>
      <stop offset="100%" style="stop-color:#BA90C6"/>
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="50%" style="stop-color:#FFE5EC"/>
      <stop offset="100%" style="stop-color:#FFE5EC"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  
  <!-- Heart Shape -->
  <path d="M256 420 C180 350, 80 280, 80 180 C80 120, 130 80, 180 80 C220 80, 245 110, 256 140 C267 110, 292 80, 332 80 C382 80, 432 120, 432 180 C432 280, 332 350, 256 420Z" 
        fill="#FFFFFF" 
        opacity="0.95"/>
  
  <!-- Pill inside heart -->
  <rect x="180" y="210" width="152" height="70" rx="35" ry="35" fill="url(#pill)" stroke="#E8A0BF" stroke-width="3"/>
  
  <!-- Pill divider line -->
  <line x1="256" y1="210" x2="256" y2="280" stroke="#E8A0BF" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Sparkles -->
  <circle cx="380" cy="120" r="12" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="400" cy="150" r="8" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="130" cy="140" r="10" fill="#FFFFFF" opacity="0.7"/>
</svg>
