<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5F8"/>
      <stop offset="100%" style="stop-color:#FFE5EC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8A0BF"/>
      <stop offset="100%" style="stop-color:#BA90C6"/>
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="50%" style="stop-color:#FFE5EC"/>
      <stop offset="100%" style="stop-color:#FFE5EC"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#E8A0BF" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#BA90C6" opacity="0.1"/>
  
  <!-- Icon Container -->
  <circle cx="300" cy="315" r="150" fill="url(#accent)"/>
  
  <!-- Heart Shape in Icon -->
  <path d="M300 420 C250 370, 180 320, 180 250 C180 210, 210 180, 245 180 C270 180, 290 200, 300 220 C310 200, 330 180, 355 180 C390 180, 420 210, 420 250 C420 320, 350 370, 300 420Z" 
        fill="#FFFFFF" 
        opacity="0.95"/>
  
  <!-- Pill inside heart -->
  <rect x="230" y="275" width="140" height="55" rx="27" ry="27" fill="url(#pill)" stroke="#E8A0BF" stroke-width="2"/>
  <line x1="300" y1="275" x2="300" y2="330" stroke="#E8A0BF" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Text -->
  <text x="520" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#333333">Rescue Pill</text>
  <text x="520" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#666666">緊急避妊支援アプリ</text>
  
  <!-- Tagline -->
  <text x="520" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#888888">もしもの時も、あわてず、次の一歩へ</text>
  
  <!-- Features -->
  <rect x="520" y="460" width="180" height="40" rx="20" fill="url(#accent)" opacity="0.8"/>
  <text x="610" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">薬局検索</text>
  
  <rect x="720" y="460" width="180" height="40" rx="20" fill="url(#accent)" opacity="0.8"/>
  <text x="810" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">セルフチェック</text>
  
  <rect x="920" y="460" width="180" height="40" rx="20" fill="url(#accent)" opacity="0.8"/>
  <text x="1010" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">匿名利用</text>
  
  <!-- Sparkles -->
  <circle cx="460" cy="200" r="8" fill="#E8A0BF" opacity="0.6"/>
  <circle cx="1050" cy="280" r="10" fill="#BA90C6" opacity="0.5"/>
  <circle cx="150" cy="500" r="6" fill="#E8A0BF" opacity="0.4"/>
</svg>
